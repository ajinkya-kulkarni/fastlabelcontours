[build-system]
requires = ["setuptools>=77", "numpy>=1.23"]
build-backend = "setuptools.build_meta"

[project]
name = "fastlabelcontours"
version = "0.1.0"
description = "Fast direct contour extraction from integer label images."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Ajinkya Kulkarni"}]
dependencies = ["numpy>=1.23"]
keywords = ["numpy", "computer-vision", "instance-segmentation", "contours", "label-images"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: C++",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Typing :: Typed",
]

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "mypy>=1.11",
    "pytest>=8",
    "ruff>=0.6",
    "twine>=5",
]
benchmark = ["opencv-python-headless>=4.8", "scipy>=1.10", "rasterio>=1.3"]
release = ["cibuildwheel>=2.22"]

[project.urls]
Homepage = "https://github.com/ajinkya-kulkarni/fastlabelcontours"
Repository = "https://github.com/ajinkya-kulkarni/fastlabelcontours"
Issues = "https://github.com/ajinkya-kulkarni/fastlabelcontours/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
strict = true
packages = ["fastlabelcontours"]

[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-* cp313-*"
skip = "*-musllinux_*"
test-command = "python -c \"import numpy as np; from fastlabelcontours import contours; r = contours(np.array([[0, 1], [1, 1]], dtype=np.uint32)); assert r.ids.tolist() == [1]\""

[tool.cibuildwheel.linux]
archs = ["x86_64", "aarch64"]

[tool.cibuildwheel.macos]
archs = ["x86_64", "arm64"]

[tool.cibuildwheel.windows]
archs = ["AMD64"]
